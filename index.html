<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alex Shorts — Projects</title>
  <meta name="description" content="Browser-first tools for scripture, learning, and family life." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1c1914;
      --muted: #5c564c;
      --paper: #f7f2e8;
      --line: rgba(28, 25, 20, 0.14);
      --accent: #8a4b1f;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Source Sans 3", system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #efe6d2 0%, transparent 55%),
        linear-gradient(180deg, #faf6ef 0%, var(--paper) 40%, #f3ebe0 100%);
      min-height: 100dvh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.28;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.45'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
      z-index: -1;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    .wrap {
      position: relative;
      width: min(920px, calc(100% - 1.5rem));
      margin: 0 auto;
      padding: 2.25rem 0 4rem;
    }

    header {
      display: grid;
      gap: 0.65rem;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1 {
      margin: 0;
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(2rem, 5vw, 2.85rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.02em;
    }

    .tagline {
      margin: 0;
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(1.05rem, 2.5vw, 1.25rem);
      font-weight: 600;
      line-height: 1.35;
      color: color-mix(in srgb, var(--ink) 88%, var(--accent));
    }

    .bio {
      margin: 0.15rem 0 0;
      max-width: 38rem;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.98rem;
    }

    .section-note {
      margin: 0 0 0.85rem;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .rows {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .row-pair {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.65rem;
      align-items: start;
    }

    @media (max-width: 640px) {
      .row-pair { grid-template-columns: 1fr; }
    }

    .tile-wrap {
      display: grid;
      gap: 0;
      min-width: 0;
    }

    .tile {
      --tile-accent: var(--accent);
      display: block;
      width: 100%;
      text-align: left;
      font: inherit;
      color: inherit;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.72);
      padding: 0.75rem 0.85rem;
      cursor: pointer;
    }

    .tile:hover { filter: brightness(1.03); }

    .tile[aria-expanded="true"] {
      outline: 2px solid var(--ink);
      outline-offset: 1px;
      background: rgba(255, 255, 255, 0.88);
      border-bottom: 0;
    }

    .tile-name {
      margin: 0;
      font-family: Fraunces, Georgia, serif;
      font-weight: 700;
      font-size: 1.12rem;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    .tile-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 0.55rem;
      align-items: center;
      margin-top: 0.35rem;
    }

    .tile-desc {
      margin: 0.35rem 0 0;
      font-size: 0.92rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .tile-date {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .lock {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: color-mix(in srgb, var(--tile-accent) 75%, var(--ink));
      border: 1px solid color-mix(in srgb, var(--tile-accent) 35%, var(--line));
      padding: 0.12rem 0.4rem;
      background: color-mix(in srgb, var(--tile-accent) 10%, white);
    }

    .detail {
      border: 1px solid var(--line);
      border-top: 0;
      background: rgba(255, 255, 255, 0.88);
      padding: 0.85rem 0.85rem 1rem;
    }

    .detail[hidden] { display: none; }

    .detail-history {
      margin: 0 0 0.85rem;
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--ink);
    }

    .previews {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.5rem;
      margin-bottom: 0.85rem;
    }

    .preview {
      aspect-ratio: 16 / 10;
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--tile-accent) 8%, var(--paper));
      overflow: hidden;
    }

    .preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .launch {
      display: inline-block;
      font: inherit;
      font-weight: 700;
      font-size: 0.82rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--tile-accent);
      border-bottom: 1px solid color-mix(in srgb, var(--tile-accent) 35%, transparent);
      padding-bottom: 0.1rem;
    }

    .launch:hover { filter: brightness(0.92); }

    footer {
      margin-top: 2.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--line);
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.45;
    }

    footer code {
      font-size: 0.85em;
      background: rgba(255, 255, 255, 0.55);
      padding: 0.1rem 0.35rem;
      border: 1px solid var(--line);
    }

    .empty {
      padding: 2rem 1rem;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      background: rgba(255, 255, 255, 0.55);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="eyebrow">Projects</p>
      <h1 id="site-title">Alex Shorts</h1>
      <p class="tagline" id="site-tagline"></p>
      <p class="bio" id="site-bio"></p>
    </header>

    <p class="section-note">Recently updated</p>
    <div class="rows" id="grid"></div>

    <footer>
      Add or edit projects in <code>projects.json</code>, then push to GitHub.
    </footer>
  </div>

  <script>
    let projects = [];
    let openId = null;

    function escapeHtml(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatDate(iso) {
      if (!iso) return "";
      const d = new Date(iso + "T12:00:00");
      if (Number.isNaN(d.getTime())) return iso;
      return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    }

    function previewsHtml(project) {
      const imgs = (project.images || []).slice(0, 3);
      if (!imgs.length) return "";
      return `<div class="previews">${imgs.map(src =>
        `<div class="preview"><img src="${escapeHtml(src)}" alt="" loading="lazy" /></div>`
      ).join("")}</div>`;
    }

    function tileHtml(project) {
      const expanded = openId === project.id;
      const lock = project.private
        ? `<span class="lock">Family</span>`
        : "";
      return `<article class="tile-wrap${expanded ? " expanded" : ""}" data-id="${escapeHtml(project.id)}">
        <button type="button" class="tile" style="--tile-accent:${escapeHtml(project.accent || "#8a4b1f")}" aria-expanded="${expanded ? "true" : "false"}" aria-controls="detail-${escapeHtml(project.id)}">
          <h2 class="tile-name">${escapeHtml(project.name)}</h2>
          <div class="tile-meta">
            ${project.updated ? `<span class="tile-date">${escapeHtml(formatDate(project.updated))}</span>` : ""}
            ${lock}
          </div>
          <p class="tile-desc">${escapeHtml(project.desc)}</p>
        </button>
        <div class="detail" id="detail-${escapeHtml(project.id)}" style="--tile-accent:${escapeHtml(project.accent || "#8a4b1f")}"${expanded ? "" : " hidden"}>
          <p class="detail-history">${escapeHtml(project.history || project.desc)}</p>
          ${previewsHtml(project)}
          <a class="launch" href="${escapeHtml(project.href)}">Open project →</a>
        </div>
      </article>`;
    }

    function buildRows(sorted, openId) {
      const rows = [];
      let i = 0;
      while (i < sorted.length) {
        const left = sorted[i];
        const right = sorted[i + 1];

        if (left?.id === openId) {
          rows.push({ type: "expanded", project: left });
          i += 1;
          continue;
        }

        if (right?.id === openId) {
          rows.push({ type: "expanded", project: right });
          rows.push({ type: "pair", projects: [left] });
          i += 2;
          continue;
        }

        if (right) {
          rows.push({ type: "pair", projects: [left, right] });
          i += 2;
        } else {
          rows.push({ type: "pair", projects: [left] });
          i += 1;
        }
      }
      return rows;
    }

    function render() {
      const sorted = [...projects].sort((a, b) => {
        const da = a.updated || "0000-01-01";
        const db = b.updated || "0000-01-01";
        return db.localeCompare(da);
      });
      const grid = document.getElementById("grid");
      if (!sorted.length) {
        grid.innerHTML = `<p class="empty">No projects in projects.json yet.</p>`;
        return;
      }

      const rows = buildRows(sorted, openId);
      grid.innerHTML = rows.map(row => {
        if (row.type === "expanded") {
          return `<div class="row row-expanded">${tileHtml(row.project)}</div>`;
        }
        return `<div class="row row-pair">${row.projects.map(tileHtml).join("")}</div>`;
      }).join("");

      grid.querySelectorAll(".tile").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.closest(".tile-wrap").dataset.id;
          openId = openId === id ? null : id;
          render();
          if (openId) {
            const wrap = grid.querySelector(`[data-id="${CSS.escape(openId)}"]`);
            wrap?.scrollIntoView({ block: "nearest", behavior: "smooth" });
          }
        });
      });
    }

    async function init() {
      try {
        const res = await fetch("projects.json", { cache: "no-store" });
        if (!res.ok) throw new Error(res.statusText);
        const data = await res.json();
        document.getElementById("site-title").textContent = data.site?.title || "Alex Shorts";
        document.getElementById("site-tagline").textContent = data.site?.tagline || "";
        document.getElementById("site-bio").textContent = data.site?.bio || "";
        document.title = `${data.site?.title || "Alex Shorts"} — Projects`;
        projects = data.projects || [];
        render();
      } catch (err) {
        document.getElementById("site-tagline").textContent = "Could not load projects.json.";
        console.error(err);
      }
    }

    init();
  </script>
</body>
</html>
