<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alex Shorts — Projects</title>
  <meta name="description" content="Browser-first tools for scripture, learning, and family life." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1c1914;
      --muted: #5c564c;
      --paper: #f7f2e8;
      --line: rgba(28, 25, 20, 0.14);
      --accent: #8a4b1f;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Source Sans 3", system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #efe6d2 0%, transparent 55%),
        linear-gradient(180deg, #faf6ef 0%, var(--paper) 40%, #f3ebe0 100%);
      min-height: 100dvh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.28;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.45'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
      z-index: -1;
    }

    .wrap {
      width: min(1100px, calc(100% - 1.5rem));
      margin: 0 auto;
      padding: 2.25rem 0 4rem;
    }

    header {
      display: grid;
      gap: 0.65rem;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1 {
      margin: 0;
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(2rem, 5vw, 2.85rem);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.02em;
    }

    .tagline {
      margin: 0;
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(1.05rem, 2.5vw, 1.25rem);
      font-weight: 600;
      line-height: 1.35;
      color: color-mix(in srgb, var(--ink) 88%, var(--accent));
    }

    .bio {
      margin: 0.15rem 0 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.98rem;
    }

    .lanes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.35rem 1.5rem;
      align-items: start;
    }

    .lane {
      display: grid;
      gap: 0.75rem;
      min-width: 0;
    }

    .lane-head {
      margin: 0;
      padding-bottom: 0.55rem;
      border-bottom: 1px solid var(--line);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .list {
      display: grid;
      gap: 0.75rem;
    }

    .card {
      display: grid;
      grid-template-columns: 7.5rem 1fr;
      gap: 0.85rem;
      align-items: start;
      padding: 0.75rem;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.72);
      color: inherit;
      text-decoration: none;
    }

    .card:hover {
      filter: brightness(1.03);
      outline: 2px solid var(--ink);
      outline-offset: 1px;
    }

    .thumb {
      aspect-ratio: 4 / 3;
      border: 1px solid var(--line);
      overflow: hidden;
      background: #e8e2d8;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-body {
      display: grid;
      gap: 0.35rem;
      align-content: start;
      min-width: 0;
    }

    .card-title {
      margin: 0;
      font-family: Fraunces, Georgia, serif;
      font-weight: 700;
      font-size: 1.15rem;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 0.55rem;
      align-items: center;
    }

    .card-date {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .lock {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--line);
      padding: 0.12rem 0.4rem;
      background: rgba(255, 255, 255, 0.55);
    }

    .card-desc {
      margin: 0;
      font-size: 0.92rem;
      color: var(--muted);
      line-height: 1.45;
    }

    footer {
      margin-top: 2.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--line);
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.45;
    }

    footer code {
      font-size: 0.85em;
      background: rgba(255, 255, 255, 0.55);
      padding: 0.1rem 0.35rem;
      border: 1px solid var(--line);
    }

    .empty {
      padding: 2rem 1rem;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      background: rgba(255, 255, 255, 0.55);
    }

    @media (max-width: 820px) {
      .lanes {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      .card {
        grid-template-columns: 1fr;
      }
      .thumb {
        aspect-ratio: 16 / 9;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="eyebrow">Projects</p>
      <h1 id="site-title">Alex Shorts</h1>
      <p class="tagline" id="site-tagline"></p>
      <p class="bio" id="site-bio"></p>
    </header>

    <div class="lanes">
      <section class="lane" aria-labelledby="lane-personal">
        <h2 class="lane-head" id="lane-personal">Personal</h2>
        <div class="list" id="list-personal"></div>
      </section>
      <section class="lane" aria-labelledby="lane-school">
        <h2 class="lane-head" id="lane-school">School</h2>
        <div class="list" id="list-school"></div>
      </section>
    </div>

    <footer>
      Add or edit projects in <code>projects.json</code>, then push to GitHub.
    </footer>
  </div>

  <script>
    function escapeHtml(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatDate(iso) {
      if (!iso) return "";
      const d = new Date(iso + "T12:00:00");
      if (Number.isNaN(d.getTime())) return iso;
      return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    }

    function cardHtml(project) {
      const lock = project.private ? `<span class="lock">Family</span>` : "";
      const date = project.updated
        ? `<span class="card-date">${escapeHtml(formatDate(project.updated))}</span>`
        : "";
      return `<a class="card" href="${escapeHtml(project.href)}">
        <div class="thumb">
          <img src="${escapeHtml(project.image)}" alt="" loading="lazy" />
        </div>
        <div class="card-body">
          <h2 class="card-title">${escapeHtml(project.name)}</h2>
          <div class="card-meta">${date}${lock}</div>
          <p class="card-desc">${escapeHtml(project.desc)}</p>
        </div>
      </a>`;
    }

    function byUpdated(a, b) {
      return (b.updated || "0000-01-01").localeCompare(a.updated || "0000-01-01");
    }

    function fillLane(el, projects) {
      el.innerHTML = projects.length
        ? projects.map(cardHtml).join("")
        : `<p class="empty">Nothing here yet.</p>`;
    }

    async function init() {
      const personal = document.getElementById("list-personal");
      const school = document.getElementById("list-school");
      try {
        const res = await fetch("projects.json", { cache: "no-store" });
        if (!res.ok) throw new Error(res.statusText);
        const data = await res.json();
        document.getElementById("site-title").textContent = data.site?.title || "Alex Shorts";
        document.getElementById("site-tagline").textContent = data.site?.tagline || "";
        document.getElementById("site-bio").textContent = data.site?.bio || "";
        document.title = `${data.site?.title || "Alex Shorts"} — Projects`;

        const projects = data.projects || [];
        fillLane(
          personal,
          projects.filter((p) => (p.lane || "personal") !== "school").sort(byUpdated)
        );
        fillLane(
          school,
          projects.filter((p) => p.lane === "school").sort(byUpdated)
        );
      } catch (err) {
        document.getElementById("site-tagline").textContent = "Could not load projects.json.";
        personal.innerHTML = `<p class="empty">Could not load projects.</p>`;
        school.innerHTML = "";
        console.error(err);
      }
    }

    init();
  </script>
</body>
</html>
