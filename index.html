<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>alex-shorts</title>
  <style>
    :root { color-scheme: light; --ink: #1a1a1a; --muted: #555; --bg: #f7f4ef; --line: #ddd5c8; }
    body { margin: 0; font-family: Georgia, "Times New Roman", serif; background: var(--bg); color: var(--ink); }
    main { max-width: 40rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
    h1 { font-size: 2rem; font-weight: 400; letter-spacing: 0.02em; margin: 0 0 0.35rem; }
    .tag { color: var(--muted); font-size: 1rem; margin: 0 0 2rem; }
    ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
    li { border-bottom: 1px solid var(--line); }
    a { display: block; padding: 1rem 0; color: inherit; text-decoration: none; }
    a:hover { color: #0b5; }
    .name { font-size: 1.15rem; }
    .desc { color: var(--muted); font-size: 0.95rem; margin-top: 0.25rem; }
  </style>
</head>
<body>
  <main>
    <h1>alex-shorts</h1>
    <p class="tag">Things you can open and use.</p>
    <ul>
      <li>
        <a href="projects/periodic-table/">
          <div class="name">Periodic table - Element Campaign</div>
          <div class="desc">Dad/kid trainer: learn, drill, duel, climb. Works offline.</div>
        </a>
      </li>
      <li>
        <a href="projects/bible-worksheets/">
          <div class="name">Bible worksheets</div>
          <div class="desc">Family print sheets - open HTML, print to PDF.</div>
        </a>
      </li>
      <li>
        <a href="projects/living-tree/">
          <div class="name">Living tree</div>
          <div class="desc">Family tree preview - open in browser.</div>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
