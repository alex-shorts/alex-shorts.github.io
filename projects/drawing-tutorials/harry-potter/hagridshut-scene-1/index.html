<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>How to Draw</title>
  <style>
    :root { --ink: #1c1914; --paper: #f4efe6; --muted: #6b645a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
      display: grid;
      grid-template-rows: auto 1fr auto auto;
      min-height: 100dvh;
    }
    header { text-align: center; padding: 0.6rem 1rem 0.2rem; }
    h1 { margin: 0; font-size: 1.3rem; }
    .meta { margin: 0.15rem 0 0; color: var(--muted); font-size: 0.95rem; }
    .stage { display: grid; place-items: center; min-height: 0; padding: 0.3rem; }
    canvas {
      background: #fffdf8;
      border: 1px solid #ddd3c4;
      border-radius: 10px;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.06);
      max-width: 94vw;
      max-height: 62dvh;
      width: auto;
      height: auto;
    }
    .say { text-align: center; padding: 0.3rem 1rem 0.2rem; max-width: 44rem; margin: 0 auto; }
    .tool { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .title { font-size: 1.25rem; font-weight: 700; margin: 0.15rem 0; }
    .caption { font-size: clamp(1.05rem, 2.6vw, 1.3rem); line-height: 1.4; margin: 0; }
    nav { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.6rem; padding: 0.6rem 1rem 0.3rem; max-width: 44rem; width: 100%; justify-self: center; }
    button { font: inherit; font-size: 1.2rem; font-weight: 700; padding: 0.8rem; border: 0; border-radius: 0.8rem; background: #1c1914; color: #fff; cursor: pointer; }
    button.next { background: #2f6f4f; }
    button:disabled { opacity: 0.35; cursor: default; }
    .row { display: flex; gap: 0.8rem; align-items: center; justify-content: center; padding: 0 1rem 0.9rem; color: var(--muted); font-size: 0.9rem; flex-wrap: wrap; }
    input[type=range] { width: min(26rem, 60vw); }
    select { font: inherit; padding: 0.2rem 0.4rem; border-radius: 6px; }
    a { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1 id="h1"></h1>
    <p class="meta" id="meta"></p>
  </header>
  <div class="stage"><canvas id="view"></canvas></div>
  <div class="say">
    <div class="tool" id="tool"></div>
    <div class="title" id="title"></div>
    <p class="caption" id="caption"></p>
  </div>
  <nav>
    <button id="back" type="button">Back</button>
    <button id="play" type="button">Replay</button>
    <button id="next" class="next" type="button">Next</button>
  </nav>
  <div class="row">
    <input id="jump" type="range" min="1" value="1" aria-label="Step" />
    <label>Speed
      <select id="speed">
        <option value="0.5">Slow</option>
        <option value="1" selected>Normal</option>
        <option value="2">Fast</option>
      </select>
    </label>
    <a id="credit" target="_blank" rel="noopener">Original video</a>
    <a id="gallery" href="../">← All drawings</a>
  </div>
  <script>window.IN_GALLERY = 1;</script>
  <script src="lesson-data.js"></script>
  <script>
    const L = window.LESSON;
    const view = document.getElementById("view");
    const vctx = view.getContext("2d");
    const $ = (id) => document.getElementById(id);
    const TOOL = { guide: "Pencil · press lightly", ink: "Pen · press harder", erase: "Eraser" };
    const FADE = 0.42;
    const GUIDE_FADE = 0.42;

    let k = 1;
    const layer = () => { const c = document.createElement("canvas"); return [c, c.getContext("2d")]; };
    const [paper, pctx] = layer();
    const [gOld, goCtx] = layer();
    const [gNew, gnCtx] = layer();
    const [iOld, ioCtx] = layer();
    const [iNew, inCtx] = layer();
    const grain = makeGrain();

    function makeGrain() {
      const c = document.createElement("canvas");
      c.width = c.height = 64;
      const x = c.getContext("2d");
      const img = x.createImageData(64, 64);
      for (let i = 0; i < img.data.length; i += 4) {
        const v = 70 + Math.random() * 50;
        img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
        img.data[i + 3] = 90 + Math.random() * 165;
      }
      x.putImageData(img, 0, 0);
      return c;
    }

    function sizeCanvases() {
      const dpr = window.devicePixelRatio || 1;
      k = Math.min(2.2, Math.max(1, dpr * 1.25));
      for (const c of [view, paper, gOld, gNew, iOld, iNew]) {
        c.width = Math.round(L.width * k);
        c.height = Math.round(L.height * k);
      }
      view.style.aspectRatio = L.width + " / " + L.height;
      pctx.fillStyle = "#fffdf8";
      pctx.fillRect(0, 0, paper.width, paper.height);
      pctx.globalAlpha = 0.05;
      pctx.fillStyle = pctx.createPattern(grain, "repeat");
      pctx.fillRect(0, 0, paper.width, paper.height);
      pctx.globalAlpha = 1;
    }

    // per-stroke arc length, cached on the stroke
    function prep(st) {
      if (st.cum) return st;
      const p = st.pts, cum = [0];
      for (let i = 1; i < p.length; i++) cum.push(cum[i - 1] + Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]));
      st.cum = cum;
      st.len = Math.max(1, cum[cum.length - 1]);
      return st;
    }
    function at(st, d) {
      const p = st.pts, c = st.cum;
      if (d <= 0) return [p[0][0], p[0][1], 0];
      let i = 1;
      while (i < c.length && c[i] < d) i++;
      if (i >= c.length) { const a = p[p.length - 2] || p[0], b = p[p.length - 1]; return [b[0], b[1], Math.atan2(b[1] - a[1], b[0] - a[0])]; }
      const u = (d - c[i - 1]) / ((c[i] - c[i - 1]) || 1);
      const a = p[i - 1], b = p[i];
      return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, Math.atan2(b[1] - a[1], b[0] - a[0])];
    }

    function taper(st, d) {
      const e = Math.min(1, d / 9, (st.len - d) / 9);
      return 0.45 + 0.55 * Math.max(0, e);
    }

    // draw the piece of a stroke between arc lengths d0..d1
    function piece(st, d0, d1) {
      if (d1 <= d0) return;
      prep(st);
      if (st.kind === "fill") return fillPiece(st, d0, d1);
      const ctx = st.kind === "guide" ? gnCtx : inCtx;
      const stepLen = 1.2;
      let prev = at(st, d0);
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      if (st.kind === "erase") {
        for (const c of [goCtx, gnCtx]) {
          c.save();
          c.globalCompositeOperation = "destination-out";
          c.lineCap = "round";
          c.lineWidth = st.width * k;
          c.beginPath();
          c.moveTo(prev[0] * k, prev[1] * k);
          for (let d = d0 + stepLen; d <= d1 + 0.01; d += stepLen) { const q = at(st, Math.min(d, d1)); c.lineTo(q[0] * k, q[1] * k); }
          c.stroke();
          c.restore();
        }
        ctx.restore();
        return;
      }
      if (st.kind === "guide") {
        ctx.strokeStyle = ctx.createPattern(grain, "repeat");
        ctx.globalAlpha = 0.85;
      } else {
        ctx.strokeStyle = "#141414";
      }
      for (let d = d0 + stepLen; d <= d1 + stepLen - 0.001; d += stepLen) {
        const dd = Math.min(d, d1);
        const q = at(st, dd);
        const w = st.kind === "guide" ? 1.9 : st.width * taper(st, dd);
        ctx.lineWidth = w * k;
        ctx.beginPath();
        ctx.moveTo(prev[0] * k, prev[1] * k);
        ctx.lineTo(q[0] * k, q[1] * k);
        ctx.stroke();
        prev = q;
      }
      ctx.restore();
    }

    function ringPath(ctx, st) {
      ctx.beginPath();
      for (const r of st.rings) {
        ctx.moveTo(r[0][0] * k, r[0][1] * k);
        for (let i = 1; i < r.length; i++) ctx.lineTo(r[i][0] * k, r[i][1] * k);
        ctx.closePath();
      }
    }
    function fillPiece(st, d0, d1) {
      const ctx = inCtx;
      ctx.save();
      ringPath(ctx, st);
      ctx.clip("evenodd");
      ctx.strokeStyle = "#141414";
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = st.width * 1.35 * k;
      ctx.beginPath();
      let q = at(st, d0);
      ctx.moveTo(q[0] * k, q[1] * k);
      for (let d = d0 + 2; d <= d1 + 1.99; d += 2) { q = at(st, Math.min(d, d1)); ctx.lineTo(q[0] * k, q[1] * k); }
      ctx.stroke();
      ctx.restore();
      if (d1 >= st.len) {
        ctx.save();
        ctx.fillStyle = "#141414";
        ringPath(ctx, st);
        ctx.fill("evenodd");
        ctx.restore();
      }
    }

    // move the "new" layers down into the faded "old" layers
    function settle() {
      goCtx.drawImage(gNew, 0, 0);
      gnCtx.clearRect(0, 0, gNew.width, gNew.height);
      ioCtx.drawImage(iNew, 0, 0);
      inCtx.clearRect(0, 0, iNew.width, iNew.height);
    }
    function whole(st) { prep(st); piece(st, 0, st.len); }

    let stepI = 0, strokeI = 0, along = 0, playing = false, pause = 0, last = 0, tip = null;

    function enter(i, animate) {
      stepI = Math.max(0, Math.min(i, L.steps.length - 1));
      for (const c of [goCtx, gnCtx, ioCtx, inCtx]) c.clearRect(0, 0, view.width, view.height);
      for (let s = 0; s < stepI; s++) { for (const st of L.steps[s].strokes) whole(st); settle(); }
      const cur = L.steps[stepI].strokes;
      strokeI = 0; along = 0; pause = 0.25;
      if (animate) { playing = true; tip = cur.length ? at(prep(cur[0]), 0) : null; }
      else { playing = false; for (const st of cur) whole(st); strokeI = cur.length; tip = null; }
      location.hash = "step-" + (stepI + 1);
      describe();
      compose();
    }

    function describe() {
      const s = L.steps[stepI];
      $("meta").textContent = "Step " + s.n + " of " + L.steps.length;
      $("tool").textContent = TOOL[s.phase];
      $("title").textContent = s.title;
      $("caption").textContent = s.caption;
      $("back").disabled = stepI === 0;
      $("next").disabled = stepI >= L.steps.length - 1;
      $("play").textContent = playing ? "Pause" : "Replay";
      $("jump").value = stepI + 1;
    }

    function compose() {
      const s = L.steps[stepI];
      const done = s.phase === "erase" || stepI === L.steps.length - 1;
      vctx.clearRect(0, 0, view.width, view.height);
      vctx.drawImage(paper, 0, 0);
      vctx.globalAlpha = GUIDE_FADE;
      vctx.drawImage(gOld, 0, 0);
      vctx.globalAlpha = 1;
      vctx.drawImage(gNew, 0, 0);
      vctx.globalAlpha = done ? 1 : FADE;
      vctx.drawImage(iOld, 0, 0);
      vctx.globalAlpha = 1;
      vctx.drawImage(iNew, 0, 0);
      if (tip && playing) drawTool(s.phase, tip);
    }

    function drawTool(phase, p) {
      const c = vctx;
      c.save();
      c.translate(p[0] * k, p[1] * k);
      c.scale(k, k);
      c.rotate(-0.9);
      if (phase === "erase") {
        c.fillStyle = "#f2b8c6"; c.strokeStyle = "#b86f84"; c.lineWidth = 1;
        c.beginPath(); c.roundRect(-8, -26, 16, 26, 3); c.fill(); c.stroke();
        c.fillStyle = "#6a7fa8"; c.fillRect(-8, -38, 16, 12);
      } else if (phase === "guide") {
        c.fillStyle = "#3d3d3d";
        c.beginPath(); c.moveTo(0, 0); c.lineTo(-3, -8); c.lineTo(3, -8); c.closePath(); c.fill();
        c.fillStyle = "#e8c9a0";
        c.beginPath(); c.moveTo(-3, -8); c.lineTo(-5.5, -16); c.lineTo(5.5, -16); c.lineTo(3, -8); c.closePath(); c.fill();
        c.fillStyle = "#f2c230"; c.fillRect(-5.5, -60, 11, 44);
        c.fillStyle = "#e79aa8"; c.fillRect(-5.5, -68, 11, 8);
      } else {
        c.fillStyle = "#141414";
        c.beginPath(); c.moveTo(0, 0); c.lineTo(-3.5, -9); c.lineTo(3.5, -9); c.closePath(); c.fill();
        c.fillStyle = "#2a2a2a"; c.fillRect(-7, -60, 14, 51);
        c.fillStyle = "#c9c9c9"; c.fillRect(-7, -40, 14, 9);
      }
      c.restore();
    }

    function speed() { return Number($("speed").value) || 1; }

    function tick(now) {
      const dt = Math.min(0.05, (now - last) / 1000 || 0);
      last = now;
      if (playing) {
        const s = L.steps[stepI];
        const list = s.strokes;
        if (pause > 0) {
          pause -= dt * speed();
          if (strokeI < list.length) {
            const target = at(prep(list[strokeI]), 0);
            if (tip) { tip = [tip[0] + (target[0] - tip[0]) * 0.25, tip[1] + (target[1] - tip[1]) * 0.25, tip[2]]; }
          }
        } else if (strokeI >= list.length) {
          playing = false;
          describe();
        } else {
          const st = prep(list[strokeI]);
          const rate = st.kind === "fill" ? 900 : st.kind === "erase" ? 520 : st.kind === "guide" ? 260 : 190;
          const next = Math.min(st.len, along + dt * speed() * rate);
          piece(st, along, next);
          along = next;
          tip = at(st, along);
          if (along >= st.len) { strokeI += 1; along = 0; pause = Math.min(0.18, 0.04 + st.len / 900); }
        }
        compose();
      }
      requestAnimationFrame(tick);
    }

    $("next").onclick = () => enter(stepI + 1, true);
    $("back").onclick = () => enter(stepI - 1, false);
    $("play").onclick = () => {
      if (playing) { playing = false; describe(); compose(); return; }
      enter(stepI, true);
    };
    $("jump").max = L.steps.length;
    $("jump").oninput = (e) => enter(Number(e.target.value) - 1, false);
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") { e.preventDefault(); $("next").click(); }
      if (e.key === "ArrowLeft") { e.preventDefault(); $("back").click(); }
      if (e.key === " ") { e.preventDefault(); $("play").click(); }
    });
    if (L.credit) { $("credit").href = L.credit.url; $("credit").textContent = "Original video (" + L.credit.creator + ")"; } else { $("credit").remove(); }
    if (!window.IN_GALLERY) $("gallery").remove();
    document.title = L.title; $("h1").textContent = L.title;

    sizeCanvases();
    const m = /step-(\d+)/.exec(location.hash);
    enter(m ? Number(m[1]) - 1 : 0, true);
    requestAnimationFrame(tick);
  </script>
</body>
</html>
