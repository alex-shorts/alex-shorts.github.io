<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Drawing Tutorials</title>
<style>
:root { --ink: #1c1914; --paper: #f4efe6; --muted: #6b645a; --card: #fffdf8; --line: #ddd3c4; }
* { box-sizing: border-box; }
body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--paper); color: var(--ink); }
header { max-width: 1200px; margin: 0 auto; padding: 1.6rem 1rem 0.6rem; }
h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.3rem); }
.lede { margin: 0.4rem 0 0; color: var(--muted); font-size: 1.05rem; }
main { max-width: 1200px; margin: 0 auto; padding: 0.4rem 1rem 3rem; }
h2 { margin: 2rem 0 0.7rem; font-size: 1.35rem; border-bottom: 2px solid var(--ink); padding-bottom: 0.3rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1rem; }
a.card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 0.7rem; color: inherit; text-decoration: none; box-shadow: 0 1px 4px rgba(0,0,0,0.05); transition: transform 0.12s, box-shadow 0.12s; }
a.card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.1); }
a.card img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; background: #fff; border-radius: 8px; }
.name { font-weight: 700; margin-top: 0.5rem; font-size: 1.05rem; }
.sub { color: var(--muted); font-size: 0.9rem; }
.crumb { color: var(--muted); }
.crumb a { color: var(--muted); }
.big { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
footer { max-width: 1200px; margin: 0 auto; padding: 0 1rem 2rem; color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<header><h1>Drawing Tutorials</h1><p class="lede">Step-by-step drawing lessons: light pencil guides first, then the pen, then the eraser.</p></header><main><div class="grid big"><a class="card" href="harry-potter/"><img src="harry-potter/cover.png" alt="" /><div class="name">Harry Potter Drawing Tutorials</div><div class="sub">7 drawings</div></a></div></main>
<footer>Fan-made drawing lessons for practice at home. Not affiliated with Warner Bros. or J.K. Rowling.</footer>
</body>
</html>
