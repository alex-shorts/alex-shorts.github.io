<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alexander Shorts — Family tree</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Outfit:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#1a2332; --muted:#5c6b7a; --paper:#f3f1ec; --forest:#1f4d3a; --gold:#c4a35a; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: Outfit, system-ui, sans-serif; color: var(--ink);
      background:
        radial-gradient(ellipse at 20% 0%, rgba(31,77,58,.12), transparent 45%),
        var(--paper);
    }
    .card {
      width: min(420px, calc(100% - 2rem));
      background: #fffdf8; border: 1px solid rgba(26,35,50,.12);
      padding: 1.75rem 1.5rem 1.5rem;
    }
    h1 { font-family: Fraunces, Georgia, serif; font-size: 1.55rem; margin: 0 0 .4rem; }
    p { margin: 0 0 1rem; color: var(--muted); font-size: .95rem; line-height: 1.45; }
    label { display: block; font-size: .75rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-bottom: .35rem; }
    input {
      width: 100%; padding: .7rem .75rem; border: 1px solid rgba(26,35,50,.18);
      font: inherit; margin-bottom: .85rem;
    }
    button {
      width: 100%; padding: .75rem; border: 0; background: var(--forest); color: #fff;
      font: inherit; font-weight: 600; cursor: pointer;
    }
    button:hover { filter: brightness(1.06); }
    .err { color: #8b2e2e; font-size: .85rem; min-height: 1.2em; margin: 0 0 .5rem; }
    .note { font-size: .75rem; color: var(--muted); margin-top: .9rem; }
  </style>
</head>
<body>
  <form class="card" id="gate" autocomplete="off">
    <h1>Alexander Shorts — Family tree</h1>
    <p>Family preview. Enter the share password to open the tree.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" required autofocus />
    <p class="err" id="err" aria-live="polite"></p>
    <button type="submit">Open tree</button>
    <p class="note">Soft gate only — not bank-level security. For family sharing.</p>
  </form>
  <script>
    (function () {
      var KEY = "ft-gate-alex-v1";
      var EXPECT = "Shorts";
      var NEXT = "./prototype/living-tree/?primary=alexander";
      try {
        if (sessionStorage.getItem(KEY) === "ok") {
          location.replace(NEXT);
          return;
        }
      } catch (e) {}
      document.getElementById("gate").addEventListener("submit", function (e) {
        e.preventDefault();
        var v = document.getElementById("pw").value || "";
        if (v === EXPECT) {
          try { sessionStorage.setItem(KEY, "ok"); } catch (err) {}
          location.replace(NEXT);
        } else {
          document.getElementById("err").textContent = "That password doesn’t match.";
          document.getElementById("pw").select();
        }
      });
    })();
  </script>
</body>
</html>
