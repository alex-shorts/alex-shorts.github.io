<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prefix Down</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Jersey+15&family=Nunito&family=Pixelify+Sans&family=Press+Start+2P&family=Silkscreen&family=Tiny5&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./resources/game-library/assets/fonts/fonts.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #0a0614; }
    #game { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    canvas { image-rendering: pixelated; }
    #boot-err { position: fixed; left: 16px; right: 16px; top: 16px; color: #f0c040; font-family: monospace; white-space: pre-wrap; }
    .ko-overlay {
      display: flex;
      flex-direction: column;
      gap: 1.2%;
      padding: 1.6% 2%;
      background: rgba(10, 6, 22, 0.96);
      border: 6px solid #f0c040;
      color: #f8f0d8;
      font-family: Nunito, "Segoe UI", sans-serif;
      pointer-events: auto;
    }
    .ko-stem {
      font-weight: 800;
      font-size: clamp(36px, 7.2vh, 84px);
      line-height: 1.15;
      color: #fff6dc;
      flex: 0 0 auto;
    }
    .ko-hint {
      font-size: clamp(20px, 2.6vh, 32px);
      color: #b8a8d8;
    }
    .ko-timer {
      height: 14px;
      background: #3a1820;
      border-radius: 4px;
      overflow: hidden;
      flex: 0 0 14px;
    }
    .ko-timer-fg {
      height: 100%;
      width: 100%;
      background: #e03838;
      transform-origin: left center;
    }
    .ko-grid {
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 2%;
      min-height: 0;
    }
    .ko-choice {
      display: flex;
      align-items: center;
      gap: 3%;
      margin: 0;
      padding: 2% 3%;
      border: 4px solid #f0c040;
      border-radius: 12px;
      background: #1c3a9a;
      color: #f8f0d8;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
    }
    .ko-choice:hover, .ko-choice:focus { background: #2a52c8; }
    .ko-num {
      flex: 0 0 auto;
      width: 1.4em;
      height: 1.4em;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #f0c040;
      color: #120818;
      font-weight: 800;
      font-size: clamp(28px, 5vh, 56px);
    }
    .ko-lab {
      font-weight: 800;
      font-size: clamp(32px, 6.2vh, 72px);
      line-height: 1.1;
    }
    .ko-input {
      width: 100%;
      box-sizing: border-box;
      font-size: clamp(36px, 6vh, 72px);
      font-family: Nunito, "Segoe UI", sans-serif;
      font-weight: 700;
      padding: 12px 16px;
      background: #1a1030;
      color: #f8f0d8;
      border: 4px solid #f0c040;
      border-radius: 10px;
    }
    .ko-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .ko-chip, .ko-enter {
      font-family: inherit;
      font-weight: 800;
      cursor: pointer;
      border-radius: 10px;
      border: 3px solid #f0c040;
      background: #241848;
      color: #f8f0d8;
      padding: 8px 14px;
      font-size: clamp(22px, 3.4vh, 40px);
    }
    .ko-chip:hover, .ko-enter:hover { background: #3a2868; }
    .ko-exp { min-width: 3.2em; }
    .ko-enter {
      background: #c07020;
      color: #120810;
      font-size: clamp(28px, 4vh, 48px);
      padding: 10px 24px;
      align-self: flex-start;
    }
    .ko-wrong {
      font-weight: 800;
      font-size: clamp(28px, 4vh, 48px);
      color: #e05050;
    }
    .ko-answer {
      font-weight: 800;
      font-size: clamp(48px, 10vh, 120px);
      line-height: 1.1;
      color: #f0c040;
      flex: 1 1 auto;
      display: flex;
      align-items: center;
    }
    .ko-gotit {
      font-family: inherit;
      font-weight: 800;
      cursor: pointer;
      border-radius: 12px;
      border: 4px solid #f0c040;
      background: #c07020;
      color: #120810;
      font-size: clamp(32px, 5vh, 64px);
      padding: 16px 32px;
      align-self: flex-start;
    }
    .ko-gotit:hover, .ko-gotit:focus { background: #e09030; }
    .tile-chart {
      position: absolute;
      left: 2%;
      right: 2%;
      top: 96px;
      z-index: 20;
      width: auto;
      max-width: 1680px;
      margin: 0 auto;
      max-height: 82%;
      overflow: auto;
      background: #1a1030;
      padding: 12px 16px 16px;
      font-family: Nunito, "Segoe UI", sans-serif;
      color: #f8f0d8;
      border: 2px solid #f0c040;
      box-sizing: border-box;
    }
    .tile-model { margin: 0 0 10px; font-size: 18px; color: #c8b8e0; }
    .tile-board { display: flex; flex-direction: column; gap: 12px; }
    .tile-grid { border-collapse: collapse; width: 100%; }
    .tile-grid th { padding: 4px 6px; font-size: 16px; color: #f0c040; }
    .tile-rowlab { width: 2.2em; color: #a090c0 !important; font-weight: 700; }
    .tile-slot {
      min-width: 9.5em;
      height: 44px;
      border: 1px dashed #504070;
      background: #120c24;
      vertical-align: middle;
      padding: 2px;
    }
    .tile-slot.over { border-color: #f0c040; background: #2a1848; }
    .tile-slot.ok { background: #1a3a20; border-style: solid; border-color: #3a8a40; }
    .tile-slot.bad { background: #4a1820; border-style: solid; border-color: #c04040; }
    .tile-wells {
      display: grid;
      grid-template-columns: 2.2em 1fr 1fr 1fr 1fr;
      gap: 6px;
      align-items: start;
    }
    .tile-well-spacer { min-height: 1px; }
    .tile-well {
      min-height: 120px;
      max-height: 22vh;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px;
      background: #120c24;
      border: 1px solid #504070;
    }
    .tile-well h3 {
      margin: 0 0 4px;
      font-size: 14px;
      color: #f0c040;
    }
    .tile-well.over { border-color: #f0c040; background: #2a1848; }
    .tile-chip {
      margin: 0;
      padding: 6px 8px;
      font: 700 15px Nunito, "Segoe UI", sans-serif;
      color: #fff6dc;
      background: #2a1a58;
      border: 2px solid #f0c040;
      border-radius: 8px;
      cursor: grab;
      touch-action: none;
      width: 100%;
      box-sizing: border-box;
      line-height: 1.15;
    }
    .tile-slot .tile-chip { width: 100%; }
    .tile-chip.dragging {
      position: fixed;
      z-index: 80;
      cursor: grabbing;
      box-shadow: 0 8px 18px #0008;
      margin: 0;
    }
    .tile-bar { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    .tile-grade, .tile-reset {
      font: 800 20px Nunito, "Segoe UI", sans-serif;
      padding: 8px 16px;
      border-radius: 10px;
      border: 3px solid #f0c040;
      cursor: pointer;
    }
    .tile-grade { background: #c07020; color: #120810; }
    .tile-reset { background: #241848; color: #f8f0d8; }
    .tile-score { font-size: 20px; font-weight: 800; color: #f0c040; }
  </style>
</head>
<body>
  <div id="boot-err" hidden></div>
  <div id="game"></div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
