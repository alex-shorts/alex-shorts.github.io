<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Share view — Living tree</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="proto-tag">SHARE</span>
      <h1>Living tree</h1>
    </div>
    <p class="lede">Loading collection…</p>
    <div class="toolbar">
      <label class="tool select-wrap">
        <span class="select-label">Primary</span>
        <select id="primary-select" aria-label="Primary person for tree and DNA"></select>
      </label>
      <button type="button" id="btn-reset" class="tool">Reset primary</button>
      <button type="button" id="btn-fit" class="tool">Fit</button>
      <label class="tool check">
        <input type="checkbox" id="toggle-physics" />
        Physics
      </label>
    </div>
  </header>

  <main class="stage">
    <svg id="graph" aria-label="Family knowledge graph"></svg>
    <aside id="panel" class="panel" hidden>
      <button type="button" class="panel-close" id="panel-close" aria-label="Close">×</button>
      <div id="panel-body"></div>
    </aside>
    <div id="lightbox" class="lightbox" hidden>
      <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close">×</button>
      <img id="lightbox-img" alt="" />
      <p id="lightbox-caption" class="lightbox-caption"></p>
    </div>
  </main>

  <footer class="legend" id="legend"></footer>
  <div id="hint" class="hint">Open from folder (or npm run prototype:tree) · drag · Primary sets tree root + expected DNA% · solid = parent→child · dashed = marriage</div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="./people-data.js"></script>
  <script src="./data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
