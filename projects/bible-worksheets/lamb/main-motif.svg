<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" role="img" aria-label="The Lamb">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8cfc0"/>
      <stop offset="100%" stop-color="#e7dfd0"/>
    </linearGradient>
    <linearGradient id="fleece" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f1e6"/>
      <stop offset="100%" stop-color="#e2d6c4"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#c9b089" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c9b089" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="320" height="400" fill="url(#sky)"/>
  <circle cx="160" cy="168" r="118" fill="url(#halo)"/>

  <!-- ground -->
  <ellipse cx="160" cy="330" rx="118" ry="28" fill="#cbbba3" opacity="0.55"/>

  <!-- body -->
  <ellipse cx="168" cy="245" rx="78" ry="58" fill="url(#fleece)" stroke="#6b5136" stroke-width="2.2"/>
  <!-- wool scallops -->
  <path d="M105 230c10-16 22-16 32-2 10-16 24-16 34-1 9-14 23-14 33 1 9-12 21-11 30 4" fill="none" stroke="#8a6a45" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M112 258c12-14 26-13 36 1 11-14 25-13 35 2 10-12 22-11 30 3" fill="none" stroke="#8a6a45" stroke-width="1.4" stroke-linecap="round"/>

  <!-- legs -->
  <path d="M125 290 v48 M148 298 v42 M188 298 v42 M212 288 v48" fill="none" stroke="#6b5136" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M118 338 h14 M141 340 h14 M181 340 h14 M205 338 h14" fill="none" stroke="#9a6b52" stroke-width="3" stroke-linecap="round"/>

  <!-- neck + head -->
  <ellipse cx="118" cy="175" rx="34" ry="40" fill="url(#fleece)" stroke="#6b5136" stroke-width="2.2"/>
  <ellipse cx="102" cy="148" rx="28" ry="24" fill="url(#fleece)" stroke="#6b5136" stroke-width="2.2"/>
  <!-- ear -->
  <path d="M118 132c18-18 34-10 28 8-8 10-20 14-28 8z" fill="#efe6d8" stroke="#6b5136" stroke-width="1.8"/>
  <path d="M122 136c10-10 18-6 14 4" fill="none" stroke="#9a6b52" stroke-width="1.3"/>
  <!-- face -->
  <ellipse cx="88" cy="150" rx="7" ry="5" fill="#3f3428"/>
  <path d="M78 162c6 7 16 8 24 2" fill="none" stroke="#6b5136" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="74" cy="156" r="2.2" fill="#9a6b52"/>

  <!-- gentle crown / staff hint -->
  <path d="M210 120c28 18 40 48 34 78" fill="none" stroke="#7a8470" stroke-width="2" stroke-linecap="round"/>
  <path d="M244 198c8 4 10 12 4 18" fill="none" stroke="#7a8470" stroke-width="2" stroke-linecap="round"/>

  <text x="160" y="378" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5c4d3d" letter-spacing="2">THE LAMB</text>
</svg>
