<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bible worksheets</title>
  <meta name="description" content="Weekly biblical imagery studies — student sheets and teacher guides, ready to print." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1c1914;
      --muted: #5c564c;
      --paper: #f7f2e8;
      --line: rgba(28, 25, 20, 0.14);
      --accent: #8a4b1f;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Source Sans 3", system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #efe6d2 0%, transparent 55%),
        linear-gradient(180deg, #faf6ef 0%, var(--paper) 40%, #f3ebe0 100%);
      min-height: 100dvh;
    }

    .wrap {
      width: min(680px, calc(100% - 1.5rem));
      margin: 0 auto;
      padding: 2rem 0 3.5rem;
    }

    .back {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    }

    header {
      margin: 1rem 0 1.75rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0 0 0.5rem;
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(1.85rem, 4vw, 2.35rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .intro {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .section-note {
      margin: 0 0 0.75rem;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .list {
      display: grid;
      gap: 0.75rem;
    }

    .card {
      display: grid;
      grid-template-columns: 6.5rem 1fr;
      gap: 0.85rem;
      padding: 0.75rem;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.72);
    }

    .thumb {
      aspect-ratio: 4 / 3;
      border: 1px solid var(--line);
      background: #e8e2d8;
      overflow: hidden;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb.empty {
      display: grid;
      place-items: center;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
      padding: 0.5rem;
    }

    .card-body { min-width: 0; }

    .card-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.35rem 0.65rem;
      margin-bottom: 0.25rem;
    }

    .card-title {
      margin: 0;
      font-family: Fraunces, Georgia, serif;
      font-size: 1.12rem;
      font-weight: 700;
    }

    .badge {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.12rem 0.4rem;
      border: 1px solid var(--line);
      color: var(--muted);
      background: rgba(255, 255, 255, 0.55);
    }

    .badge.new { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
    .badge.progress { font-style: italic; }

    .verse {
      margin: 0 0 0.55rem;
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.45;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem 0.85rem;
    }

    .links a {
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    }

    .links a:hover { filter: brightness(0.9); }

    footer {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    footer code {
      font-size: 0.85em;
      background: rgba(255, 255, 255, 0.55);
      padding: 0.1rem 0.35rem;
      border: 1px solid var(--line);
    }

    @media (max-width: 520px) {
      .card { grid-template-columns: 1fr; }
      .thumb { aspect-ratio: 16 / 9; max-height: 12rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../../">← All projects</a>
    <header>
      <h1 id="title">Bible worksheets</h1>
      <p class="intro" id="intro"></p>
    </header>

    <p class="section-note">Themes · newest first</p>
    <div class="list" id="list"></div>

    <footer>
      Edit themes in <code>worksheets.json</code>, sync folders from the imagery library, then push.
    </footer>
  </div>

  <script>
    function escapeHtml(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatDate(iso) {
      if (!iso) return "";
      const d = new Date(iso + "T12:00:00");
      if (Number.isNaN(d.getTime())) return iso;
      return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    }

    function linkHtml(label, href) {
      return `<a href="${escapeHtml(href)}">${escapeHtml(label)}</a>`;
    }

    function cardHtml(w) {
      const thumb = w.thumb
        ? `<div class="thumb"><img src="${escapeHtml(w.thumb)}" alt="" loading="lazy" /></div>`
        : `<div class="thumb empty">In progress</div>`;

      const badge = w.status
        ? `<span class="badge${w.status === "New" ? " new" : w.status === "In progress" ? " progress" : ""}">${escapeHtml(w.status)}</span>`
        : (w.updated ? `<span class="badge">${escapeHtml(formatDate(w.updated))}</span>` : "");

      const links = [];
      if (w.student) links.push(linkHtml("Student", w.student));
      if (w.teacher) links.push(linkHtml(w.teacherLabel || "Teacher", w.teacher));
      if (w.familyRecap) links.push(linkHtml(w.familyRecapLabel || "After this week", w.familyRecap));
      if (w.packReview) links.push(linkHtml("Pack review", w.packReview));
      (w.links || []).forEach(l => links.push(linkHtml(l.label, l.href)));

      return `<article class="card">
        ${thumb}
        <div class="card-body">
          <div class="card-head">
            <h2 class="card-title">${escapeHtml(w.name)}</h2>
            ${badge}
          </div>
          <p class="verse">${escapeHtml(w.verse)}</p>
          <div class="links">${links.join("")}</div>
        </div>
      </article>`;
    }

    async function init() {
      try {
        const res = await fetch("worksheets.json", { cache: "no-store" });
        if (!res.ok) throw new Error(res.statusText);
        const data = await res.json();
        document.getElementById("title").textContent = data.title || "Bible worksheets";
        document.getElementById("intro").textContent = data.intro || "";
        document.title = data.title || "Bible worksheets";

        const items = (data.worksheets || []).sort((a, b) => {
          const da = a.updated || "0000-01-01";
          const db = b.updated || "0000-01-01";
          return db.localeCompare(da);
        });

        document.getElementById("list").innerHTML = items.map(cardHtml).join("");
      } catch (err) {
        document.getElementById("intro").textContent = "Could not load worksheets.json.";
        console.error(err);
      }
    }

    init();
  </script>
</body>
</html>
