<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Fighter — Spark checklist</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="theme-light.css"/><style>    :root {
      --cycle: #8a3d1f;
      --cycle-mid: #a65a32;
      --cycle-soft: #f0e4dc;
      --accent: #d4a078;
      --paper: #f3eee4;
      --ink: #1c1914;
    }
    body {
      color: var(--ink);
      background: radial-gradient(900px 520px at 12% -10%, rgba(138, 61, 31, 0.14), transparent 58%), radial-gradient(700px 420px at 100% 0%, rgba(212, 160, 120, 0.12), transparent 52%), var(--paper);
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
    }
    a { color: #7a3d0f; }
    a:hover { color: var(--cycle); }
    .wrap { max-width: 720px; padding: 0 1.1rem 2.2rem; }
    .mast { margin: 0 -1.1rem 0.7rem; padding: 0.85rem 1.1rem 1.05rem; background: linear-gradient(115deg, #4a1f0a 0%, #8a3d1f 50%, #5c2a12 100%); color: #f6f1e4; border-radius: 0 0 18px 18px; }
    .mast .site-nav { margin: 0 0 0.7rem; }
    .mast .site-nav a { background: rgba(255,255,255,0.08); color: #e6dfce; border-color: rgba(255,255,255,0.18); font-size: 0.72rem; padding: 0.22rem 0.55rem; }
    .mast .site-nav a.active { background: rgba(255,255,255,0.2); color: #fff; border-color: var(--accent); }
    .mast .eyebrow { color: var(--accent); margin: 0 0 0.25rem; }
    .mast h1 { font-size: clamp(1.85rem, 4.5vw, 2.6rem); font-weight: 500; color: #f6f1e4; margin: 0 0 0.3rem; }
    .mast .lede { color: #d9d0bb; font-size: 0.92rem; line-height: 1.45; }
    .mast .tag { background: rgba(255,255,255,0.08); color: #e6dfce; }
    .print-btn { font: inherit; font-size: 0.72rem; font-weight: 700; cursor: pointer; margin-left: auto; border-radius: 999px; padding: 0.28rem 0.75rem; border: 1px solid var(--accent); background: var(--accent); color: #222; }
    .hero-row { display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; }
    .section-lede { margin: 0 0 0.5rem; font-size: 0.88rem; }
    .check-head { display: flex; align-items: baseline; gap: 0.5rem; margin-bottom: 0.35rem; }
    .check-head h2 { margin: 0; font-size: 1.1rem; }
    .check-reset { font: inherit; font-size: 0.72rem; color: #7a7368; background: none; border: none; text-decoration: underline; cursor: pointer; margin-left: auto; }
    .check-bars { display: grid; gap: 0.35rem; margin: 0 0 0.75rem; }
    @media (min-width: 520px) { .check-bars { grid-template-columns: repeat(4, 1fr); } }
    .check-bar { background: #faf6ee; border: 1px solid #ddd4c4; border-radius: 8px; padding: 0.4rem 0.5rem; }
    .check-bar.ok { background: var(--cycle-soft); border-color: #c5cfb0; }
    .check-bar .lbl { font-size: 0.62rem; font-weight: 750; text-transform: uppercase; color: var(--cycle-mid); }
    .check-bar .nums { font-size: 0.78rem; font-weight: 700; }
    .check-bar .meter { height: 4px; background: #e4dccb; border-radius: 2px; margin-top: 0.25rem; overflow: hidden; }
    .check-bar .meter span { display: block; height: 100%; background: var(--cycle); }
    .check-layer h3 { font-size: 0.68rem; font-weight: 750; text-transform: uppercase; color: #7a7368; }
    .check-nodes { display: grid; gap: 0.3rem; }
    @media (min-width: 560px) { .check-nodes.cols-2 { grid-template-columns: 1fr 1fr; } }
    .check-item { display: grid; grid-template-columns: auto 1fr; gap: 0.45rem; width: 100%; text-align: left; font: inherit; cursor: pointer; border: 1px solid #ddd4c4; border-radius: 8px; padding: 0.45rem 0.55rem; background: #fff; }
    .check-item.done { background: var(--cycle-soft); border-color: #c5cfb0; }
    .check-item.opt { border-style: dashed; }
    .check-item .box { width: 1.05rem; height: 1.05rem; border: 2px solid #b8b0a4; border-radius: 4px; margin-top: 0.1rem; display: grid; place-content: center; font-size: 0.72rem; font-weight: 800; color: #fff; }
    .check-item.done .box { background: var(--cycle); border-color: var(--cycle); }
    .check-item .tl { font-weight: 700; font-size: 0.84rem; }
    .check-item .tm { font-size: 0.74rem; color: #6a6358; display: block; margin-top: 0.1rem; }
    footer { margin-top: 1rem; padding-top: 0.5rem; border-top: 1px solid #ddd4c4; color: #7a7368; font-size: 0.78rem; }
</style></head><body>
<div class="wrap"><header class="mast">
      <nav class="site-nav screen-only" aria-label="Primary">
        <a href="../../">Projects</a>
        <a href="../">The Preparation</a>
        <a href="../catalog.html">CLEP classes</a>
        <a href="../resources.html">Resources</a>
        <a class="active" href="./">Checklist</a>
        <a href="../fighter.html">Plan</a>
      </nav>
<p class="eyebrow">Cycle 9 · Spark</p><h1>Fighter checklist</h1>
<p class="lede">← Back to one-pager</p>
<div class="hero-row"><button type="button" class="print-btn" onclick="window.print()">Print</button></div>
</header>
<div class="check-head"><h2>Progress</h2><button type="button" class="check-reset screen-only" id="check-reset" hidden>Reset all</button></div>
<div class="check-bars" id="check-bars"></div>
<div class="check-layers" id="check-layers">
      <div class="check-layer" data-layer="foundation"><h3>Foundation</h3><div class="check-nodes cols-2">
          <button type="button" class="check-item" data-id="gate-gym"><span class="box"></span><span><span class="tl">Serious gym selected + trial done</span><span class="tm">Ethos · Bares · GB Tyler</span></span></button>
          <button type="button" class="check-item" data-id="gate-firstaid"><span class="box"></span><span><span class="tl">First Aid / CPR current</span><span class="tm">Red Cross</span></span></button>
          <button type="button" class="check-item" data-id="gate-physical"><span class="box"></span><span><span class="tl">Sports physical on file</span><span class="tm">If comp route</span></span></button>
        </div></div>
      <div class="check-layer" data-layer="build"><h3>Build</h3><div class="check-nodes cols-2">
          <button type="button" class="check-item" data-id="build-enroll"><span class="box"></span><span><span class="tl">3–5 month enrollment active</span><span class="tm">Nov–Mar overlaps basketball</span></span></button>
          <button type="button" class="check-item" data-id="build-hours"><span class="box"></span><span><span class="tl">60+ training hours logged</span><span class="tm">Pads · bag · sparring progression</span></span></button>
          <button type="button" class="check-item" data-id="build-nutrition"><span class="box"></span><span><span class="tl">Nutrition + recovery log</span><span class="tm">Weight class awareness</span></span></button>
          <button type="button" class="check-item" data-id="build-sparring"><span class="box"></span><span><span class="tl">Controlled sparring cleared by coach</span><span class="tm">Not before coach says yes</span></span></button>
        </div></div>
      <div class="check-layer" data-layer="climax"><h3>Climax</h3><div class="check-nodes cols-2">
          <button type="button" class="check-item" data-id="climax-grading"><span class="box"></span><span><span class="tl">Belt grading OR local amateur bout</span><span class="tm">Sanctioned · coach corner</span></span></button>
          <button type="button" class="check-item" data-id="climax-record"><span class="box"></span><span><span class="tl">Official result on paper</span><span class="tm">Win not required · finish the round</span></span></button>
        </div></div>
      <div class="check-layer" data-layer="optional"><h3>Optional</h3><div class="check-nodes cols-2">
          <button type="button" class="check-item opt" data-id="opt-thailand"><span class="box"></span><span><span class="tl"><span class="opt-tag">Opt · </span>Thailand Muay Thai camp</span><span class="tm">Maxim travel — post-HS optional</span></span></button>
          <button type="button" class="check-item opt" data-id="opt-psych-clep"><span class="box"></span><span><span class="tl"><span class="opt-tag">Opt · </span>Intro Psych CLEP passed</span><span class="tm">After class + Modern States</span></span></button>
        </div></div>
</div>
<footer>Fighter one-pager</footer></div>
<script>
(function(){const KEY="fighter-spark-checklist-v1";const LAYERS={'foundation': ['gate-gym', 'gate-firstaid', 'gate-physical'], 'build': ['build-enroll', 'build-hours', 'build-nutrition', 'build-sparring'], 'climax': ['climax-grading', 'climax-record'], 'optional': ['opt-thailand', 'opt-psych-clep']};const LABELS={foundation:"Foundation",build:"Build",climax:"Climax",optional:"Optional"};
let done={};try{done=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){}
function save(){localStorage.setItem(KEY,JSON.stringify(done))}
function render(){document.querySelectorAll(".check-item").forEach(b=>{const on=!!done[b.dataset.id];b.classList.toggle("done",on);b.querySelector(".box").textContent=on?"✓":""});
document.getElementById("check-bars").innerHTML=Object.entries(LAYERS).map(([l,ids])=>{const n=ids.filter(i=>done[i]).length;const t=ids.length;return `<div class="check-bar${n===t?" ok":""}"><div class="lbl">${LABELS[l]}</div><div class="nums">${n} / ${t}</div><div class="meter"><span style="width:${t?Math.round(n/t*100):0}%"></span></div></div>`}).join("");
document.getElementById("check-reset").hidden=!Object.keys(done).length}
document.getElementById("check-layers").onclick=e=>{const b=e.target.closest(".check-item");if(!b)return;const id=b.dataset.id;if(done[id])delete done[id];else done[id]=1;save();render()};
document.getElementById("check-reset").onclick=()=>{if(confirm("Reset?")){done={};save();render()}};
render()})();
</script></body></html>
